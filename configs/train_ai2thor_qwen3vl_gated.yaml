seed: 7
candidate_actions:
  - MoveAhead
  - MoveBack
  - MoveLeft
  - MoveRight
  - RotateLeft
  - RotateRight
  - LookUp
  - LookDown
  - Stay
data:
  data_dir: /mnt/f/see2move/data/ai2thor_oracle_10k_stay
  records_path: /mnt/f/see2move/data/ai2thor_oracle_10k_stay/records.jsonl
  qwen_features_path: /mnt/f/see2move/features/qwen3vl_ai2thor_oracle_10k_stay.pt
  image_size: 128
  max_depth: 5.0
  split_strategy: scene
  val_fraction: 0.2
model:
  architecture: gated
  qwen_hidden_dim: 512
  depth_dim: 128
  pose_hidden_dim: 64
  hidden_dim: 512
  dropout: 0.25
  modality_dropout: 0.15
train:
  output_dir: runs/ai2thor_policy_10k_stay_qwen3vl_gated_e20
  epochs: 20
  batch_size: 64
  learning_rate: 0.001
  scheduler: cosine
  min_learning_rate: 0.00005
  weight_decay: 0.0005
  selection_metric: balanced_gain_score
  class_weighting: inverse_frequency
  max_class_weight: 3.0
  focal_loss_gamma: 0.5
  soft_target_weight: 0.05
  soft_target_temperature: 2000.0
  gradient_clip_norm: 1.0
  early_stopping_patience: 8
  early_stopping_min_delta: 0.0
  num_workers: 0
