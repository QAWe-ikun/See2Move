task:
  name: generalized_occlusion_aware_viewpoint
  objective: choose the next camera motion that maximizes instruction-conditioned visibility
  target_types:
    - object
    - receptacle
    - support_surface
    - container_interior
    - free_space_region
    - affordance_region
  relation_types:
    - under
    - inside
    - behind
    - between
    - on
    - near
    - left_of
    - right_of
    - lower_level
    - upper_level

observations:
  rgb: true
  depth: true
  z_buffer: true
  camera_pose: true
  history: true
  semantic_masks_optional: true
  open_vocabulary_detections_optional: true

action_space:
  discrete_actions:
    - stop
    - forward_0_25m
    - back_0_25m
    - strafe_left_0_25m
    - strafe_right_0_25m
    - yaw_left_15deg
    - yaw_right_15deg
    - pitch_up_15deg
    - pitch_down_15deg
    - raise_camera_0_10m
    - lower_camera_0_10m
  waypoint_actions:
    enabled: true
    headings: 12
    distances_m: [0.25, 0.50, 0.75, 1.00]

oracle_scoring:
  visible_target_area: 2.0
  visible_region_area: 2.0
  occlusion_reduction: 1.5
  depth_margin: 0.5
  semantic_match: 1.0
  collision_risk: -4.0
  motion_cost: -0.4
  revisited_view: -0.5

model:
  text_encoder: clip_or_bert
  rgb_encoder: dinov2_or_resnet
  depth_encoder: ddppo_resnet_or_depth_transformer
  fusion: cross_attention
  prediction_head: candidate_score

evaluation:
  success_visibility_threshold: 0.35
  max_steps: 10
  heldout_axes:
    - object_category
    - spatial_relation
    - room_type
    - scene
    - occluder_type
