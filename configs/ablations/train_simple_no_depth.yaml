seed: 7
candidate_actions:
  - MoveAhead
  - MoveBack
  - MoveLeft
  - MoveRight
  - RotateLeft
  - RotateRight
  - LookUp
  - LookDown
  - Stay
data:
  data_dir: /mnt/f/see2move/data/ai2thor_oracle_10k_stay
  records_path: /mnt/f/see2move/data/ai2thor_oracle_10k_stay/records.jsonl
  image_size: 128
  max_depth: 5.0
  max_text_len: 32
  max_vocab_size: 4096
  split_strategy: scene
  val_fraction: 0.2
  ablation:
    use_rgb: true
    use_depth: false
    use_text: true
    use_pose: true
model:
  architecture: simple
  text_dim: 64
  hidden_dim: 128
  dropout: 0.1
train:
  output_dir: runs/ablations_10k_stay/simple_no_depth
  epochs: 30
  batch_size: 16
  learning_rate: 0.001
  scheduler: none
  min_learning_rate: 0.00005
  weight_decay: 0.0001
  selection_metric: accuracy
  class_weighting: none
  max_class_weight: 2.0
  soft_target_weight: 0.0
  soft_target_temperature: 2000.0
  gradient_clip_norm: 1.0
  early_stopping_patience: 8
  early_stopping_min_delta: 0.0
  num_workers: 0
